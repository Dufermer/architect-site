# ═══════════════════════════════════════════════════════════════
# Logrotate config — dunaev.dev services
# Part of DUN-105 monitoring stack
# ═══════════════════════════════════════════════════════════════
#
# Install: sudo cp infra/monitoring/logrotate.conf /etc/logrotate.d/dunaev

# ── Nginx access & error logs ─────────────────────────────────
/var/log/nginx/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    dateext
    dateformat -%Y%m%d
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}

# ── Docker container logs (avoid filling disk) ────────────────
/var/lib/docker/containers/*/*.log {
    rotate 7
    daily
    compress
    missingok
    delaycompress
    copytruncate
    size 50M
}

# ── Application logs ──────────────────────────────────────────
/var/log/dunaev/*.log {
    daily
    rotate 30
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    missingok
    notifempty
    copytruncate
}

# ── Backup logs ───────────────────────────────────────────────
/var/backups/dunaev/logs/*.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
}

# ── System logs ───────────────────────────────────────────────
/var/log/syslog
/var/log/messages
/var/log/kern.log
/var/log/auth.log
/var/log/debug
/var/log/daemon.log {
    rotate 12
    weekly
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        invoke-rc.d rsyslog rotate >/dev/null 2>&1 || true
    endscript
}
