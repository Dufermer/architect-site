# ═══════════════════════════════════════════════════════════════
# Docker Compose — Architect Platform (DUN-144)
# All services: frontend, backend, db, cache
# ═══════════════════════════════════════════════════════════════

services:
  # ── Go Backend API ──────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: architect-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/architect.db
      - CORS_ORIGIN=${CORS_ORIGIN:-https://dunaev.dev}
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  # ── Frontend (Astro — Nginx-served) ───────────────────────
  frontend:
    build:
      context: ../landing
      dockerfile: ../infra/Dockerfile.frontend
    container_name: architect-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  # ── PostgreSQL (optional, for future use) ──────────────────
  postgres:
    image: postgres:16-alpine
    container_name: architect-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${PG_DB:-architect}
      POSTGRES_USER: ${PG_USER:-architect}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-architect}"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - full
      - db
    networks:
      - internal

  # ── Redis (cache / session store) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: architect-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - full
      - cache
    networks:
      - internal

  # ── Reverse Proxy (Nginx) ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: architect-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
      # SSL certificates (Let's Encrypt)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    extra_hosts:
      - "comfyui:host-gateway"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 2
    profiles:
      - full
      - proxy
    networks:
      - internal
      - public

volumes:
  backend-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
