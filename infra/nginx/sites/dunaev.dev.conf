# ═══════════════════════════════════════════════════════════════
# Site config — dunaev.dev (main site)
# ═══════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dunaev.dev www.dunaev.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS site ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dunaev.dev www.dunaev.dev;

    # SSL (Let's Encrypt via Certbot)
    ssl_certificate     /etc/letsencrypt/live/dunaev.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dunaev.dev/privkey.pem;

    # ── Static site (/) ─────────────────────────────────────────
    location / {
        proxy_pass http://frontend_static;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            proxy_pass http://frontend_static;
        }

        # No cache for HTML
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
            proxy_pass http://frontend_static;
        }
    }

    # ── API (/api/) ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, X-Request-ID" always;
            add_header Access-Control-Max-Age 300 always;
            return 204;
        }
    }

    # ── ComfyUI (/comfy/) ────────────────────────────────────────
    location /comfy/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://comfyui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Large uploads for image generation
        client_max_body_size 100M;

        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, X-Request-ID" always;
            add_header Access-Control-Max-Age 300 always;
            return 204;
        }
    }

    # ── Health check ────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ── Deny sensitive paths ────────────────────────────────────
    location ~ /\.(git|env|ht) {
        deny all;
        return 404;
    }

    location = /robots.txt {
        alias /usr/share/nginx/html/robots.txt;
    }
}
