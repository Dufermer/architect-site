<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b3f48" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#1a1d23" />
  <rect width="800" height="800" fill="url(#grid)" />
  <rect x="0" y="0" width="800" height="3" fill="url(#accentGrad)" />

  <!-- ===== TOP BAR ===== -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="800" height="64" fill="#232730" rx="0" />
    <rect x="28" y="18" width="28" height="28" rx="6" fill="url(#accentGrad)" />
    <text x="68" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#D8DEE9">ARCHITECT</text>
    <rect x="620" y="17" width="150" height="30" rx="15" fill="#5b21b6" opacity="0.6"/>
    <text x="695" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#a78bfa" text-anchor="middle">ARCHITECTURE</text>
    <line x1="0" y1="64" x2="800" y2="64" stroke="#3b3f48" stroke-width="1" opacity="0.6" />
  </g>

  <!-- ===== TITLE ===== -->
  <g transform="translate(400, 114)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#a78bfa" text-anchor="middle">STACK OVERVIEW</text>
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#D8DEE9" text-anchor="middle">Как устроен Architect</text>
  </g>

  <!-- ===== LAYER 1: Cloudflare (Y=160) ===== -->
  <g transform="translate(400, 178)" filter="url(#cardShadow)">
    <rect x="-120" y="-20" width="240" height="40" rx="8" fill="#0f1117" />
    <rect x="-120" y="-20" width="240" height="40" rx="8" fill="none" stroke="#f6821f" stroke-width="1.5" opacity="0.7" />
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f6821f" text-anchor="middle">☁️ Cloudflare</text>
    <text x="130" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#8b92a0" text-anchor="start">DNS · CDN · Workers</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="218" x2="400" y2="248" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ===== LAYER 2: VPS (Y=250) ===== -->
  <g filter="url(#cardShadow)">
    <rect x="160" y="248" width="480" height="52" rx="10" fill="#232730" />
    <rect x="160" y="248" width="480" height="52" rx="10" fill="none" stroke="#3b3f48" stroke-width="1" />
    <text x="400" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#8b92a0" text-anchor="middle">🖥  VPS (Self-Hosted)</text>
    <text x="400" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b21b6" text-anchor="middle">Docker · Nginx · Linux</text>
  </g>

  <!-- Arrows from VPS to 3 blocks -->
  <line x1="220" y1="300" x2="220" y2="340" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="400" y1="300" x2="400" y2="340" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="580" y1="300" x2="580" y2="340" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ===== LAYER 3: Three blocks side by side ===== -->
  <!-- Block 1: Astro Site -->
  <g transform="translate(155, 340)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="150" height="120" rx="10" fill="#1a1d23" />
    <rect x="0" y="0" width="150" height="120" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="32" rx="10" fill="#7c3aed" opacity="0.15" />
    <text x="75" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">Astro.js</text>
    <text x="75" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D8DEE9" text-anchor="middle">Landing</text>
    <text x="75" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D8DEE9" text-anchor="middle">MDX Blog</text>
    <text x="75" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D8DEE9" text-anchor="middle">Tailwind CSS</text>
    <text x="75" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#8b92a0" text-anchor="middle">Static SSG</text>
  </g>

  <!-- Block 2: ComfyUI -->
  <g transform="translate(325, 340)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="150" height="120" rx="10" fill="#1a1d23" />
    <rect x="0" y="0" width="150" height="120" rx="10" fill="none" stroke="#22c55e" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="32" rx="10" fill="#22c55e" opacity="0.12" />
    <text x="75" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#22c55e" text-anchor="middle">ComfyUI</text>
    <text x="75" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D8DEE9" text-anchor="middle">Stable Diffusion</text>
    <text x="75" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D8DEE9" text-anchor="middle">OG Images</text>
    <text x="75" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D8DEE9" text-anchor="middle">SMM Previews</text>
    <text x="75" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#8b92a0" text-anchor="middle">RTX 3070</text>
  </g>

  <!-- Block 3: Services -->
  <g transform="translate(495, 340)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="150" height="120" rx="10" fill="#1a1d23" />
    <rect x="0" y="0" width="150" height="120" rx="10" fill="none" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="32" rx="10" fill="#3b82f6" opacity="0.12" />
    <text x="75" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#3b82f6" text-anchor="middle">Services</text>
    <text x="75" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D8DEE9" text-anchor="middle">Analytics</text>
    <text x="75" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D8DEE9" text-anchor="middle">CRM</text>
    <text x="75" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#D8DEE9" text-anchor="middle">Email / Newsletter</text>
    <text x="75" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#8b92a0" text-anchor="middle">CI/CD Pipeline</text>
  </g>

  <!-- Lines connecting blocks side to side -->
  <line x1="305" y1="400" x2="325" y2="400" stroke="#3b3f48" stroke-width="1" stroke-dasharray="4,3" />
  <line x1="475" y1="400" x2="495" y2="400" stroke="#3b3f48" stroke-width="1" stroke-dasharray="4,3" />

  <!-- ===== LAYER 4: AI Agent Layer (Y=490) ===== -->
  <!-- Arrow from each block down -->
  <line x1="230" y1="460" x2="230" y2="490" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="400" y1="460" x2="400" y2="490" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="570" y1="460" x2="570" y2="490" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" />

  <g transform="translate(400, 498)" filter="url(#cardShadow)">
    <rect x="-200" y="-16" width="400" height="56" rx="10" fill="#0f1117" />
    <rect x="-200" y="-16" width="400" height="56" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,3" />
    <rect x="-200" y="-16" width="400" height="28" rx="10" fill="#7c3aed" opacity="0.1" />
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#a78bfa" text-anchor="middle">🤖 AI Agent Layer</text>
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#8b92a0" text-anchor="middle">Paperclip · Hermes · SEO.SYS — Автономные агенты</text>
  </g>

  <!-- ===== BOTTOM STATS ===== -->
  <g transform="translate(0, 0)">
    <line x1="40" y1="600" x2="760" y2="600" stroke="#3b3f48" stroke-width="1" opacity="0.4" />

    <!-- Stat 1 -->
    <rect x="100" y="620" width="160" height="60" rx="8" fill="#232730" />
    <text x="180" y="644" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#22c55e" text-anchor="middle">81</text>
    <text x="180" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#8b92a0" text-anchor="middle">Issues создано</text>

    <!-- Stat 2 -->
    <rect x="320" y="620" width="160" height="60" rx="8" fill="#232730" />
    <text x="400" y="644" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#7c3aed" text-anchor="middle">60</text>
    <text x="400" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#8b92a0" text-anchor="middle">✅ Выполнено</text>

    <!-- Stat 3 -->
    <rect x="540" y="620" width="160" height="60" rx="8" fill="#232730" />
    <text x="620" y="644" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#eab308" text-anchor="middle">12</text>
    <text x="620" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#8b92a0" text-anchor="middle">AI агентов</text>
  </g>

  <!-- ===== FOOTER ===== -->
  <g transform="translate(0, 0)">
    <rect x="0" y="720" width="800" height="80" fill="#232730" />
    <!-- Bottom CTA -->
    <rect x="240" y="730" width="320" height="40" rx="20" fill="url(#accentGrad)" filter="url(#glow)" />
    <text x="400" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#fff" text-anchor="middle">🔗 Читать статью на Dev.to</text>
  </g>
</svg>