<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="release-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1200"/>
      <stop offset="100%" stop-color="#1a1d23"/>
    </linearGradient>
    <linearGradient id="release-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="release-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="release-cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="release-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#release-bg)"/>
  <rect width="1200" height="630" fill="url(#release-accent)"/>

  <!-- Top gold accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#release-bar)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="630" fill="url(#release-bar)" opacity="0.5"/>

  <!-- Grid dots -->
  <g fill="#3b3f48" opacity="0.15">
    <circle cx="80" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/>
    <circle cx="80" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/><circle cx="400" cy="240" r="1.5"/>
    <circle cx="80" cy="400" r="1.5"/><circle cx="240" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/>
    <circle cx="80" cy="560" r="1.5"/><circle cx="240" cy="560" r="1.5"/><circle cx="400" cy="560" r="1.5"/>
  </g>

  <!-- Logo (gold variant) -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="16" height="28" rx="3" fill="#f59e0b"/>
    <rect x="20" y="4" width="16" height="24" rx="3" fill="#f59e0b" opacity="0.6"/>
    <rect x="0" y="10" width="30" height="6" rx="2" fill="#f59e0b"/>
    <text x="50" y="24" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#D8DEE9" letter-spacing="2">ARCHITECT</text>
  </g>

  <!-- Release badge -->
  <g transform="translate(48, 88)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#f59e0b"/>
    <text x="80" y="18" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#1a1200" text-anchor="middle" letter-spacing="2">NEW RELEASE v4.0</text>
  </g>

  <!-- Title -->
  <g transform="translate(48, 160)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="#D8DEE9">
      <tspan x="0" dy="0">Introducing Architect</tspan>
      <tspan x="0" dy="48" fill="#fbbf24">Platform v4.0</tspan>
    </text>

    <text x="0" y="105" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="400" fill="#8b92a0">
      <tspan x="0" dy="0">Multi-agent orchestration, ComfyUI integration,</tspan>
      <tspan x="0" dy="26">and a completely redesigned plugin system.</tspan>
    </text>

    <!-- CTA -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="200" height="42" rx="21" fill="url(#release-cta)" filter="url(#release-glow)"/>
      <text x="100" y="26" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1200" text-anchor="middle" letter-spacing="1">RELEASE NOTES →</text>
    </g>
  </g>

  <!-- Right: version badge -->
  <g transform="translate(900, 200)">
    <rect x="0" y="0" width="240" height="240" rx="120" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="200" rx="100" fill="none" stroke="#f59e0b" stroke-opacity="0.1" stroke-width="1"/>
    <text x="120" y="115" font-family="'Inter', system-ui, sans-serif" font-size="56" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="-2">4.0</text>
    <text x="120" y="145" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#f59e0b" text-anchor="middle" letter-spacing="3">MAJOR RELEASE</text>
  </g>
</svg>
