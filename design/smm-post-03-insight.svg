<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232730" />
      <stop offset="100%" stop-color="#1a1d23" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b3f48" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#0f1117" />
  <rect width="800" height="800" fill="url(#grid)" />
  <rect x="0" y="0" width="800" height="3" fill="url(#accentGrad)" />

  <!-- ===== TOP ===== -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="18" height="28" rx="4" fill="url(#accentGrad)" />
    <rect x="23" y="5" width="18" height="23" rx="4" fill="url(#accentGrad)" opacity="0.7" />
    <rect x="0" y="11" width="32" height="5" rx="2.5" fill="#7c3aed" />
    <text x="52" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2.5" fill="#D8DEE9">ARCHITECT</text>
  </g>

  <g transform="translate(590, 32)">
    <rect x="0" y="0" width="174" height="28" rx="14" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1" />
    <text x="87" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#a78bfa" text-anchor="middle">INSIGHT · ARCHITECTURE</text>
  </g>

  <!-- ===== QUOTE / INSIGHT CARD ===== -->
  <g transform="translate(400, 320)">
    <!-- Large decorative opening quote mark -->
    <text x="-160" y="-120" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="url(#accentGrad)" opacity="0.15">"</text>

    <!-- Heading / insight -->
    <text x="0" y="-60" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#D8DEE9" text-anchor="middle">
      <tspan x="0" dy="0">How to Build an</tspan>
      <tspan x="0" dy="46" fill="url(#accentGrad)">Open-Source</tspan>
      <tspan x="0" dy="46">Ecosystem</tspan>
    </text>

    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#8b92a0" text-anchor="middle">
      <tspan x="0" dy="0">5 lessons from building Architect's</tspan>
      <tspan x="0" dy="24">multi-agent platform on open-source</tspan>
      <tspan x="0" dy="24">components. From ComfyUI to Hermes.</tspan>
    </text>
  </g>

  <!-- ===== LESSONS LIST ===== -->
  <g transform="translate(100, 510)">
    <rect x="0" y="0" width="600" height="110" rx="12" fill="#232730" />
    <g transform="translate(30, 18)">
      <circle cx="8" cy="8" r="4" fill="#a78bfa" />
      <text x="22" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#D8DEE9">Start with modular, replaceable components</text>

      <circle cx="8" cy="38" r="4" fill="#a78bfa" />
      <text x="22" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#D8DEE9">Design the API first, build the UI second</text>

      <circle cx="8" cy="68" r="4" fill="#a78bfa" />
      <text x="22" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#D8DEE9">Automate everything — CI/CD from day one</text>
    </g>
  </g>

  <!-- ===== CTA ===== -->
  <g transform="translate(400, 670)">
    <rect x="-120" y="-20" width="240" height="44" rx="22" fill="url(#accentGrad)" filter="url(#glow)" />
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#fff" text-anchor="middle">READ THE FULL STORY</text>
  </g>

  <!-- Footer -->
  <g transform="translate(0, 762)">
    <rect x="0" y="0" width="800" height="38" fill="#232730" />
    <text x="400" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5b21b6" text-anchor="middle">© 2026 ARCHITECT · OPEN-SOURCE ECOSYSTEM</text>
  </g>
</svg>
