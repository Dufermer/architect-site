<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#1a1d23" />
    </linearGradient>
    <linearGradient id="heroGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0" />
    </linearGradient>
    <filter id="browserShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.08" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b3f48" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
    <clipPath id="browserClip">
      <rect x="60" y="40" width="1080" height="600" rx="8" />
    </clipPath>
  </defs>

  <!-- ===== OUTER BACKGROUND ===== -->
  <rect width="1200" height="675" fill="#0a0c10" />

  <!-- ===== BROWSER WINDOW FRAME ===== -->
  <g filter="url(#browserShadow)">
    <!-- Title bar -->
    <rect x="60" y="8" width="1080" height="32" rx="8" fill="#1e212a" />
    <rect x="60" y="28" width="1080" height="12" fill="#1e212a" />
    
    <!-- Traffic lights -->
    <circle cx="84" cy="24" r="5" fill="#ef4444" />
    <circle cx="100" cy="24" r="5" fill="#eab308" />
    <circle cx="116" cy="24" r="5" fill="#22c55e" />
    
    <!-- Address bar -->
    <rect x="320" y="17" width="280" height="18" rx="9" fill="#2d313a" />
    <text x="460" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b92a0" text-anchor="middle">✕ architect.dev</text>
    
    <!-- Browser content area -->
    <rect x="60" y="40" width="1080" height="600" rx="8" fill="#1a1d23" />
  </g>

  <!-- ===== LANDING PAGE CONTENT (inside browser) ===== -->
  <g clip-path="url(#browserClip)">
    <!-- Background -->
    <rect x="60" y="40" width="1080" height="600" fill="url(#bgGrad)" />
    <rect x="60" y="40" width="1080" height="600" fill="url(#grid)" />
    <rect x="60" y="40" width="1080" height="300" fill="url(#heroGlow)" />

    <!-- ===== NAVBAR ===== -->
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="1080" height="60" fill="#232730" />
      
      <!-- Logo -->
      <rect x="40" y="18" width="24" height="24" rx="5" fill="url(#accentGrad)" />
      <text x="75" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#D8DEE9">ARCHITECT</text>
      
      <!-- Nav links -->
      <text x="810" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b92a0">Docs</text>
      <text x="870" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b92a0">Blog</text>
      <text x="930" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b92a0">About</text>
      
      <!-- GitHub button -->
      <rect x="990" y="14" width="72" height="32" rx="6" fill="#7c3aed" />
      <text x="1026" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">⭐ Star</text>
    </g>

    <!-- ===== HERO SECTION ===== -->
    <g transform="translate(60, 100)">
      <!-- Left content -->
      <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#7c3aed">OPEN-SOURCE PLATFORM</text>
      <text x="80" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="#D8DEE9">
        <tspan x="80" dy="0">Build Your Digital</tspan>
        <tspan x="80" dy="46" fill="url(#accentGrad)">Presence</tspan>
        <tspan x="80" dy="46" fill="#D8DEE9">On Your Own Stack</tspan>
      </text>
      <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8b92a0">
        <tspan x="80" dy="0">One self-hosted platform replaces 5+ paid services.</tspan>
        <tspan x="80" dy="24">No vendor lock-in. No monthly bills. Full control.</tspan>
      </text>
      
      <!-- CTA buttons -->
      <g transform="translate(80, 260)">
        <rect x="0" y="0" width="140" height="42" rx="21" fill="url(#accentGrad)" filter="url(#glow)" />
        <text x="70" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Get Started</text>
        
        <rect x="152" y="0" width="140" height="42" rx="21" fill="none" stroke="#3b3f48" stroke-width="1.5" />
        <text x="222" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#D8DEE9" text-anchor="middle">Read Docs →</text>
      </g>

      <!-- Right side: architecture visual -->
      <g transform="translate(620, 20)">
        <rect x="0" y="0" width="380" height="280" rx="16" fill="#232730" filter="url(#cardShadow)" />
        
        <!-- Stack layers -->
        <g transform="translate(30, 30)">
          <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#8b92a0">OUR STACK</text>
          
          <!-- Each layer -->
          <g transform="translate(0, 30)">
            <rect x="0" y="0" width="320" height="34" rx="6" fill="#1a1d23" />
            <rect x="0" y="0" width="6" height="34" rx="3" fill="#7c3aed" />
            <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D8DEE9">Astro.js + Tailwind</text>
            <text x="300" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b92a0" text-anchor="end">SSG</text>
          </g>
          <g transform="translate(0, 72)">
            <rect x="0" y="0" width="320" height="34" rx="6" fill="#1a1d23" />
            <rect x="0" y="0" width="6" height="34" rx="3" fill="#a78bfa" />
            <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D8DEE9">ComfyUI + Stable Diffusion</text>
            <text x="300" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b92a0" text-anchor="end">GPU</text>
          </g>
          <g transform="translate(0, 114)">
            <rect x="0" y="0" width="320" height="34" rx="6" fill="#1a1d23" />
            <rect x="0" y="0" width="6" height="34" rx="3" fill="#22c55e" />
            <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D8DEE9">Cloudflare + VPS</text>
            <text x="300" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b92a0" text-anchor="end">INFRA</text>
          </g>
          <g transform="translate(0, 156)">
            <rect x="0" y="0" width="320" height="34" rx="6" fill="#1a1d23" />
            <rect x="0" y="0" width="6" height="34" rx="3" fill="#eab308" />
            <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D8DEE9">Paperclip + Hermes AI Agents</text>
            <text x="300" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b92a0" text-anchor="end">AI</text>
          </g>
        </g>
      </g>
    </g>

    <!-- ===== FEATURES STRIP ===== -->
    <g transform="translate(60, 420)">
      <rect x="0" y="0" width="1080" height="120" fill="#0f1117" />
      
      <!-- Feature 1 -->
      <g transform="translate(60, 25)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#7c3aed" opacity="0.15" />
        <text x="8" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#7c3aed">⚡</text>
        <text x="44" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#D8DEE9">Lightning Fast</text>
        <text x="44" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b92a0">Static sites, instant loads</text>
      </g>
      
      <!-- Feature 2 -->
      <g transform="translate(340, 25)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#22c55e" opacity="0.15" />
        <text x="8" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#22c55e">🎨</text>
        <text x="44" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#D8DEE9">AI Graphics</text>
        <text x="44" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b92a0">Stable Diffusion on your GPU</text>
      </g>
      
      <!-- Feature 3 -->
      <g transform="translate(620, 25)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#eab308" opacity="0.15" />
        <text x="8" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#eab308">🤖</text>
        <text x="44" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#D8DEE9">AI Agents</text>
        <text x="44" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b92a0">Automated operations</text>
      </g>
      
      <!-- Feature 4 -->
      <g transform="translate(900, 25)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#3b82f6" opacity="0.15" />
        <text x="8" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#3b82f6">🔓</text>
        <text x="44" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#D8DEE9">Open Source</text>
        <text x="44" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b92a0">100% transparent</text>
      </g>
    </g>

    <!-- ===== FOOTER ===== -->
    <g transform="translate(60, 540)">
      <rect x="0" y="0" width="1080" height="100" fill="#232730" />
      <text x="540" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b92a0" text-anchor="middle">Built with Astro.js · Deployed on Cloudflare + VPS</text>
      <text x="540" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#5b21b6" text-anchor="middle">© 2026 Architect · Open-Source Ecosystem · #buildinpublic</text>
      
      <!-- Social links -->
      <circle cx="480" cy="80" r="12" fill="#7c3aed" opacity="0.2" />
      <text x="480" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">TG</text>
      <circle cx="520" cy="80" r="12" fill="#7c3aed" opacity="0.2" />
      <text x="520" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">X</text>
      <circle cx="560" cy="80" r="12" fill="#7c3aed" opacity="0.2" />
      <text x="560" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">GH</text>
    </g>
  </g>

  <!-- Overlay badge -->
  <g transform="translate(1050, 12)">
    <rect x="0" y="0" width="100" height="24" rx="12" fill="#22c55e" />
    <text x="50" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0a0c10" text-anchor="middle">🌐 LIVE NOW</text>
  </g>
</svg>
