<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#5b21b6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#1a1d23" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b3f48" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#1a1d23" />
  <rect width="1200" height="675" fill="url(#heroBg)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)" />

  <!-- Logo top-left -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="18" height="28" rx="4" fill="url(#accentGrad)" />
    <rect x="23" y="5" width="18" height="23" rx="4" fill="url(#accentGrad)" opacity="0.7" />
    <rect x="0" y="11" width="32" height="5" rx="2.5" fill="#7c3aed" />
    <text x="52" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2.5" fill="#D8DEE9">ARCHITECT</text>
  </g>

  <!-- Badge -->
  <g transform="translate(930, 34)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="url(#accentGrad)" />
    <text x="115" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#fff" text-anchor="middle">ABOUT THE PLATFORM</text>
  </g>

  <!-- ===== LEFT: Main content ===== -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#a78bfa">WELCOME TO THE FUTURE</text>

    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#D8DEE9">
      <tspan x="0" dy="0">What is</tspan>
    </text>
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="-0.5" fill="url(#accentGrad)">
      <tspan x="0" dy="0">Architect?</tspan>
    </text>

    <text x="0" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#8b92a0">
      <tspan x="0" dy="0">A unified platform for designing, building, and</tspan>
      <tspan x="0" dy="26">scaling digital products — powered by an</tspan>
      <tspan x="0" dy="26">open-source ecosystem of AI agents.</tspan>
    </text>

    <!-- Feature pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#232730" stroke="#3b3f48" stroke-width="1" />
      <text x="70" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#a78bfa" text-anchor="middle">Multi-Agent</text>
      <rect x="154" y="0" width="140" height="32" rx="16" fill="#232730" stroke="#3b3f48" stroke-width="1" />
      <text x="224" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#a78bfa" text-anchor="middle">Open Source</text>
      <rect x="308" y="0" width="160" height="32" rx="16" fill="#232730" stroke="#3b3f48" stroke-width="1" />
      <text x="388" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#a78bfa" text-anchor="middle">CI/CD Native</text>
    </g>

    <!-- CTA -->
    <g transform="translate(0, 330)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="url(#accentGrad)" filter="url(#glow)" />
      <text x="120" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#fff" text-anchor="middle">EXPLORE DOCS →</text>
    </g>
  </g>

  <!-- ===== RIGHT: Architecture preview ===== -->
  <g transform="translate(760, 140)">
    <rect x="0" y="0" width="380" height="390" rx="16" fill="#232730" />
    <!-- Abstract architecture diagram -->
    <g transform="translate(40, 30)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1" />
      <text x="70" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">Paperclip API</text>
      <!-- Box 2 -->
      <rect x="160" y="0" width="140" height="50" rx="8" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1" />
      <text x="230" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">Hermes Agents</text>
      <!-- Arrow 1→2 -->
      <text x="148" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#3b3f48" text-anchor="middle">→</text>
      <!-- Box 3 -->
      <rect x="0" y="80" width="140" height="50" rx="8" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1" />
      <text x="70" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">Site (Astro)</text>
      <!-- Box 4 -->
      <rect x="160" y="80" width="140" height="50" rx="8" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1" />
      <text x="230" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">ComfyUI</text>
      <!-- Arrow 3→4 -->
      <text x="148" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#3b3f48" text-anchor="middle">→</text>
      <!-- Bottom box -->
      <rect x="40" y="170" width="220" height="60" rx="8" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1" />
      <text x="150" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#22c55e" text-anchor="middle">Automated Pipeline</text>
      <!-- Arrow 2→5 and 4→5 -->
      <text x="148" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#3b3f48" text-anchor="middle">↓</text>
      <!-- Label -->
      <text x="150" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#8b92a0" text-anchor="middle">Fully integrated workflow from</text>
      <text x="150" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#8b92a0" text-anchor="middle">idea to production deployment.</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(0, 640)">
    <rect x="0" y="0" width="1200" height="35" fill="#232730" />
    <text x="600" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5b21b6" text-anchor="middle">© 2026 ARCHITECT · OPEN-SOURCE ECOSYSTEM</text>
  </g>
</svg>
