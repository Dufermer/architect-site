<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="deep-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#1a1d23"/>
    </linearGradient>
    <linearGradient id="deep-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#5b21b6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="deep-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#deep-bg)"/>
  <rect width="1200" height="630" fill="url(#deep-accent)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="630" fill="url(#deep-bar)"/>

  <!-- Minimal grid dots -->
  <g fill="#2d313a" opacity="0.2">
    <circle cx="80" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/>
    <circle cx="80" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/><circle cx="400" cy="240" r="1.5"/>
    <circle cx="80" cy="400" r="1.5"/><circle cx="240" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/>
    <circle cx="80" cy="560" r="1.5"/><circle cx="240" cy="560" r="1.5"/><circle cx="400" cy="560" r="1.5"/>
  </g>

  <!-- Logo -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="16" height="28" rx="3" fill="#7c3aed"/>
    <rect x="20" y="4" width="16" height="24" rx="3" fill="#7c3aed" opacity="0.6"/>
    <rect x="0" y="10" width="30" height="6" rx="2" fill="#7c3aed"/>
    <text x="50" y="24" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#D8DEE9" letter-spacing="2">ARCHITECT</text>
  </g>

  <!-- Category badge -->
  <g transform="translate(48, 88)">
    <rect x="0" y="0" width="120" height="26" rx="13" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="0.5"/>
    <text x="60" y="17" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#a78bfa" text-anchor="middle" letter-spacing="2">DEEP DIVE</text>
  </g>

  <!-- Title — large minimal typography -->
  <g transform="translate(48, 150)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5" fill="#D8DEE9">
      <tspan x="0" dy="0">Building Multi-Agent</tspan>
      <tspan x="0" dy="46" fill="#a78bfa">Systems from Scratch</tspan>
    </text>

    <text x="0" y="100" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="400" fill="#8b92a0">
      <tspan x="0" dy="0">A practical guide to architecting, deploying, and</tspan>
      <tspan x="0" dy="26">scaling autonomous agent networks in production.</tspan>
    </text>

    <!-- Meta info -->
    <text x="0" y="160" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5b21b6" letter-spacing="0.5">
      <tspan x="0" dy="0">12 min read · Architect Engineering · June 2026</tspan>
    </text>
  </g>

  <!-- Right side: abstract decoration -->
  <g transform="translate(860, 140)">
    <!-- Stacked geometric shapes -->
    <rect x="0" y="0" width="280" height="180" rx="12" fill="#232730" opacity="0.6"/>
    <rect x="20" y="20" width="240" height="140" rx="8" fill="none" stroke="#3b3f48" stroke-width="1" stroke-dasharray="6 4"/>
    <!-- Code-like lines -->
    <rect x="40" y="40" width="120" height="6" rx="3" fill="#7c3aed" opacity="0.3"/>
    <rect x="40" y="56" width="160" height="6" rx="3" fill="#3b3f48" opacity="0.5"/>
    <rect x="40" y="72" width="80" height="6" rx="3" fill="#3b3f48" opacity="0.5"/>
    <rect x="40" y="98" width="140" height="6" rx="3" fill="#7c3aed" opacity="0.2"/>
    <rect x="40" y="114" width="100" height="6" rx="3" fill="#3b3f48" opacity="0.5"/>
    <rect x="40" y="140" width="60" height="6" rx="3" fill="#22c55e" opacity="0.3"/>
  </g>
</svg>
