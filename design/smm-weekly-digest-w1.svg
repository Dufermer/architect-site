    <rect x="0" y="0" width="132" height="4" rx="2" fill="#7c3aed" />
    <text x="66" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#a78bfa" text-anchor="middle">13</text>
