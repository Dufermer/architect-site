    <text x="220" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">RSR</text>

    <circle cx="260" cy="676" r="10" fill="#ef4444" />
    <text x="260" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">QA</text>

    <circle cx="300" cy="676" r="10" fill="#8b5cf6" />
    <text x="300" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">OPS</text>

