    <rect x="0" y="0" width="156" height="4" rx="2" fill="#22c55e" />
    <text x="78" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#22c55e" text-anchor="middle">80</text>
