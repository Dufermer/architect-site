    <text x="100" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">ENG</text>

    <circle cx="140" cy="676" r="10" fill="#22c55e" />
    <text x="140" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">PM</text>

