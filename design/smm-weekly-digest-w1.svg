    <text x="400" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#fff" text-anchor="middle">⭐ Подписаться на @dunaevdev</text>
    <!-- Social links -->
    <text x="400" y="785" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#5b21b6" text-anchor="middle">TG: @dunaevdev · X: @superking · GitHub: dufermer</text>
