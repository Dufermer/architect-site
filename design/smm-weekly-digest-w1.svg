    <rect x="0" y="0" width="156" height="4" rx="2" fill="#eab308" />
    <text x="78" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#eab308" text-anchor="middle">41</text>
