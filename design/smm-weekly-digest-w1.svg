<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b3f48" stroke-width="0.5" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#1a1d23" />
  <rect width="800" height="800" fill="url(#grid)" />
  <rect x="0" y="0" width="800" height="3" fill="url(#accentGrad)" />

  <!-- ===== TOP BAR ===== -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="800" height="64" fill="#232730" rx="0" />
    <rect x="28" y="18" width="28" height="28" rx="6" fill="url(#accentGrad)" />
    <text x="68" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#D8DEE9">ARCHITECT</text>
    <rect x="622" y="17" width="150" height="30" rx="15" fill="url(#goldGrad)" opacity="0.85"/>
    <text x="697" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#fff" text-anchor="middle">WEEKLY DIGEST</text>
    <line x1="0" y1="64" x2="800" y2="64" stroke="#3b3f48" stroke-width="1" opacity="0.6" />
  </g>

  <!-- ===== TITLE ===== -->
  <g transform="translate(400, 115)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#f59e0b" text-anchor="middle">НЕДЕЛЯ 1</text>
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#D8DEE9" text-anchor="middle">Что сделано за неделю</text>
    <text x="0" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#8b92a0" text-anchor="middle">06–12 июня 2026 · #buildinpublic</text>
  </g>

  <!-- ===== STATS ROW ===== -->
  <!-- Total -->
  <g transform="translate(82, 170)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="156" height="100" rx="12" fill="#232730" />
    <text x="78" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#D8DEE9" text-anchor="middle">150</text>
    <text x="78" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#8b92a0" text-anchor="middle">Issues создано</text>
    <rect x="30" y="72" width="96" height="3" rx="1.5" fill="#3b3f48" />
  </g>

  <!-- Done -->
