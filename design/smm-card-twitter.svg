<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <!-- Brand accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>

    <!-- CTA glow -->
    <filter id="ctaGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b3f48" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>

    <!-- Left-side panel gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232730" />
      <stop offset="100%" stop-color="#1a1d23" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#1a1d23" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)" />

  <!-- Left accent panel -->
  <rect x="0" y="0" width="4" height="675" fill="url(#accentGrad)" opacity="0.6" />

  <!-- ===== LOGO TOP-LEFT ===== -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="18" height="28" rx="4" fill="url(#accentGrad)" />
    <rect x="23" y="5" width="18" height="23" rx="4" fill="url(#accentGrad)" opacity="0.7" />
    <rect x="0" y="11" width="32" height="5" rx="2.5" fill="#7c3aed" />
    <text x="52" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2.5" fill="#D8DEE9">ARCHITECT</text>
    <text x="52" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" letter-spacing="3" fill="#7c3aed" opacity="0.7">DESIGN · BUILD · SCALE</text>
  </g>

  <!-- Top-right badge -->
  <g transform="translate(930, 34)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="url(#accentGrad)" />
    <text x="115" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#fff" text-anchor="middle">X / TWITTER CARD</text>
  </g>

  <!-- ===== LEFT CONTENT (2/3) ===== -->
  <g transform="translate(60, 170)">
    <!-- Eyebrow -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#a78bfa">PLATFORM UPDATE</text>

    <!-- Heading line 1 -->
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" fill="#D8DEE9">
      <tspan x="0" dy="0">Introducing the</tspan>
    </text>

    <!-- Heading line 2 (accent) -->
    <text x="0" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5" fill="url(#accentGrad)">
      <tspan x="0" dy="0">Architect</tspan>
      <tspan x="0" dy="58">Agent SDK v2</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" letter-spacing="0.3" fill="#8b92a0">
      <tspan x="0" dy="0">Build, deploy, and scale multi-agent systems</tspan>
      <tspan x="0" dy="24">with the next generation of our open-source SDK.</tspan>
    </text>

    <!-- CTA -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="url(#accentGrad)" filter="url(#ctaGlow)" />
      <text x="120" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#fff" text-anchor="middle">LEARN MORE →</text>
    </g>
  </g>

  <!-- ===== RIGHT STATS PANEL ===== -->
  <g transform="translate(780, 170)">
    <!-- Panel background -->
    <rect x="0" y="0" width="360" height="340" rx="16" fill="#232730" />
    <rect x="0" y="0" width="360" height="340" rx="16" fill="url(#panelGrad)" opacity="0.3" />

    <!-- Section title -->
    <text x="180" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#8b92a0" text-anchor="middle">OPEN SOURCE ECOSYSTEM</text>
    <line x1="60" y1="50" x2="300" y2="50" stroke="#3b3f48" stroke-width="0.5" />

    <!-- Stat 1 -->
    <text x="180" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#22c55e" text-anchor="middle">12.4K+</text>
    <text x="180" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#8b92a0" text-anchor="middle">GitHub Stars</text>

    <!-- Stat 2 -->
    <text x="180" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#22c55e" text-anchor="middle">3.2K+</text>
    <text x="180" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#8b92a0" text-anchor="middle">Community Members</text>

    <!-- Stat 3 -->
    <text x="180" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#22c55e" text-anchor="middle">500+</text>
    <text x="180" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#8b92a0" text-anchor="middle">Built-in Integrations</text>
  </g>

  <!-- ===== FOOTER ===== -->
  <g transform="translate(0, 640)">
    <rect x="0" y="0" width="1200" height="35" fill="#232730" />
    <text x="600" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5b21b6" text-anchor="middle">© 2026 ARCHITECT · OPEN-SOURCE ECOSYSTEM</text>
  </g>
</svg>
