<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="vid-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d23"/>
    </linearGradient>
    <linearGradient id="vid-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="vid-glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="vid-blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="play-btn">
      <circle cx="960" cy="540" r="80"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#vid-bg)"/>

  <!-- Accent overlay -->
  <rect width="1920" height="1080" fill="url(#vid-accent)"/>

  <!-- Glow center -->
  <circle cx="960" cy="540" r="400" fill="url(#vid-glow)" filter="url(#vid-blur)"/>

  <!-- Grid pattern -->
  <g stroke="#2d313a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
  </g>

  <!-- Decorative architecture blocks -->
  <g transform="translate(960, 540)" opacity="0.25">
    <rect x="-200" y="-140" width="120" height="120" rx="6" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <rect x="-120" y="-100" width="80" height="80" rx="4" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="40" y="-180" width="160" height="160" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
    <rect x="80" y="-80" width="60" height="60" rx="4" fill="#7c3aed" opacity="0.1"/>
    <line x1="-80" y1="-80" x2="40" y2="-100" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
    <line x1="-80" y1="-20" x2="80" y2="-20" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4" opacity="0.2"/>
    <rect x="-280" y="40" width="60" height="60" rx="4" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
    <rect x="140" y="60" width="80" height="80" rx="4" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Content -->
  <g transform="translate(0, 260)">
    <!-- Logo -->
    <g transform="translate(860, 0)">
      <rect x="0" y="0" width="24" height="50" rx="4" fill="url(#vid-accent)"/>
      <rect x="30" y="6" width="24" height="44" rx="4" fill="url(#vid-accent)" opacity="0.6"/>
      <rect x="0" y="18" width="48" height="12" rx="3" fill="#7c3aed"/>
      <text x="72" y="36" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#D8DEE9" letter-spacing="3">ARCHITECT</text>
    </g>

    <!-- Headline -->
    <text x="960" y="180" font-family="'Inter', sans-serif" font-size="56" font-weight="700" fill="#D8DEE9" text-anchor="middle" letter-spacing="-1">
      Платформа для создания
    </text>
    <text x="960" y="250" font-family="'Inter', sans-serif" font-size="56" font-weight="700" fill="#D8DEE9" text-anchor="middle" letter-spacing="-1">
      цифровых продуктов
    </text>

    <!-- Subtitle -->
    <text x="960" y="310" font-family="'Inter', sans-serif" font-size="20" fill="#8b92a0" text-anchor="middle" font-weight="400">
      Архитектура · Дизайн · Разработка · Аналитика · Маркетинг
    </text>
  </g>

  <!-- Play button overlay -->
  <g transform="translate(960, 680)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="64" fill="#7c3aed" opacity="0.2"/>
    <polygon points="-20,-28 -20,28 32,0" fill="#D8DEE9" opacity="0.9"/>
  </g>

  <!-- Timeline bar -->
  <g transform="translate(760, 860)">
    <rect x="0" y="0" width="400" height="4" rx="2" fill="#2d313a"/>
    <rect x="0" y="0" width="140" height="4" rx="2" fill="#7c3aed"/>
    <circle cx="140" cy="2" r="6" fill="#7c3aed"/>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="12" fill="#8b92a0">0:00</text>
    <text x="380" y="24" font-family="'Inter', sans-serif" font-size="12" fill="#8b92a0" text-anchor="end">2:30</text>
  </g>

  <!-- Controls bar -->
  <g transform="translate(800, 920)" opacity="0.4">
    <rect x="0" y="0" width="320" height="40" rx="20" fill="none" stroke="#3b3f48" stroke-width="1"/>
    <text x="160" y="26" font-family="'Inter', sans-serif" font-size="13" fill="#8b92a0" text-anchor="middle">▶ Intro placeholder — заменить на видео</text>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="980" width="1920" height="100" fill="url(#vid-bg)" opacity="0.9"/>
</svg>
