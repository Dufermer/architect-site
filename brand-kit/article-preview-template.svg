<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="preview-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d23"/>
    </linearGradient>
    <linearGradient id="preview-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="preview-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#preview-bg)"/>

  <!-- Purple accent overlay -->
  <rect width="1200" height="630" fill="url(#preview-accent)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#preview-bar)"/>

  <!-- Grid dots pattern -->
  <g fill="#2d313a" opacity="0.3">
    <circle cx="60" cy="60" r="2"/><circle cx="180" cy="60" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="420" cy="60" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="180" cy="180" r="2"/><circle cx="300" cy="180" r="2"/><circle cx="420" cy="180" r="2"/>
    <circle cx="60" cy="300" r="2"/><circle cx="180" cy="300" r="2"/><circle cx="300" cy="300" r="2"/><circle cx="420" cy="300" r="2"/>
    <circle cx="60" cy="420" r="2"/><circle cx="180" cy="420" r="2"/><circle cx="300" cy="420" r="2"/><circle cx="420" cy="420" r="2"/>
    <circle cx="60" cy="540" r="2"/><circle cx="180" cy="540" r="2"/><circle cx="300" cy="540" r="2"/><circle cx="420" cy="540" r="2"/>
  </g>

  <!-- Logo area (top-left) -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="16" height="32" rx="3" fill="#7c3aed"/>
    <rect x="20" y="4" width="16" height="28" rx="3" fill="#7c3aed" opacity="0.6"/>
    <rect x="0" y="11" width="30" height="8" rx="2" fill="#7c3aed"/>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#D8DEE9" letter-spacing="2">ARCHITECT</text>
  </g>

  <!-- Content area -->
  <g transform="translate(48, 180)">
    <!-- Category badge -->
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#7c3aed" fill-opacity="0.15"/>
    <text x="50" y="19" font-family="'Inter', sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="600" letter-spacing="1">СТАТЬЯ</text>

    <!-- Title (editable) — placeholder text -->
    <text x="0" y="80" font-family="'Inter', sans-serif" font-size="42" font-weight="700" fill="#D8DEE9" letter-spacing="-0.5">
      Название статьи
    </text>
    <text x="0" y="130" font-family="'Inter', sans-serif" font-size="42" font-weight="700" fill="#D8DEE9" letter-spacing="-0.5">
      в две строки максимум
    </text>

    <!-- Description (editable) -->
    <text x="0" y="180" font-family="'Inter', sans-serif" font-size="18" fill="#8b92a0" font-weight="400">
      Краткое описание — до 200 символов. Место для короткого
    </text>
    <text x="0" y="206" font-family="'Inter', sans-serif" font-size="18" fill="#8b92a0" font-weight="400">
      описания материала на превью.
    </text>
  </g>

  <!-- Meta info (bottom-left) -->
  <g transform="translate(48, 520)">
    <circle cx="12" cy="12" r="12" fill="#7c3aed" opacity="0.3"/>
    <text x="12" y="17" font-family="'Inter', sans-serif" font-size="11" fill="#D8DEE9" text-anchor="middle" font-weight="600">A</text>
    <text x="36" y="18" font-family="'Inter', sans-serif" font-size="14" fill="#8b92a0" font-weight="400">Architect Team · 5 мин чтения</text>
  </g>

  <!-- Right-side decorative element -->
  <g transform="translate(1000, 100)" opacity="0.15">
    <rect x="0" y="0" width="120" height="120" rx="8" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <rect x="20" y="20" width="80" height="80" rx="6" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="40" y="40" width="40" height="40" rx="4" fill="#7c3aed"/>
  </g>

  <!-- Instructions overlay (invisible in final, shown as guide) -->
  <!--
  ИНСТРУКЦИЯ ПО ИСПОЛЬЗОВАНИЮ:
  1. Откройте в Figma или редакторе SVG
  2. Замените текст "Название статьи" и "Краткое описание"
  3. При необходимости — измените категорию (СТАТЬЯ → НОВОСТЬ/ГАЙД/КЕЙС)
  4. Автор: измените "Architect Team" на нужное имя
  -->
</svg>
