<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" fill="none">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d23"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="720" fill="url(#hero-bg)"/>

  <!-- Grid pattern -->
  <g stroke="#232730" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="100" x2="1440" y2="100"/>
    <line x1="0" y1="200" x2="1440" y2="200"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="400" x2="1440" y2="400"/>
    <line x1="0" y1="500" x2="1440" y2="500"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="600" y1="0" x2="600" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="1000" y1="0" x2="1000" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
  </g>

  <!-- Glow orb -->
  <circle cx="720" cy="360" r="280" fill="url(#hero-glow)" filter="url(#glow)"/>

  <!-- Abstract architecture blocks -->
  <g transform="translate(720, 360)" opacity="0.4">
    <rect x="-120" y="-80" width="80" height="80" rx="4" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.6"/>
    <rect x="-60" y="-60" width="60" height="60" rx="4" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.4"/>
    <rect x="20" y="-100" width="100" height="100" rx="4" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
    <rect x="40" y="-40" width="40" height="40" rx="4" fill="#7c3aed" opacity="0.15"/>
    <!-- Connecting lines -->
    <line x1="-40" y1="-40" x2="20" y2="-50" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  </g>

  <!-- Content area -->
  <g transform="translate(100, 180)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1"/>
    <text x="70" y="21" font-family="'Inter', sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600" letter-spacing="1">ПЛАТФОРМА MVP</text>

    <!-- Headline -->
    <text x="0" y="90" font-family="'Inter', sans-serif" font-size="64" font-weight="700" fill="#D8DEE9" letter-spacing="-1">
      Стройте систему
    </text>
    <text x="0" y="160" font-family="'Inter', sans-serif" font-size="64" font-weight="700" fill="#D8DEE9" letter-spacing="-1">
      которая растёт с вами
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="'Inter', sans-serif" font-size="18" fill="#8b92a0" font-weight="400">
      Архитектура, дизайн, аналитика и маркетинг — всё в одной экосистеме.
    </text>

    <!-- CTA -->
    <rect x="0" y="250" width="180" height="48" rx="8" fill="#7c3aed"/>
    <text x="90" y="280" font-family="'Inter', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">
      Начать →
    </text>

    <!-- Secondary CTA -->
    <rect x="200" y="250" width="180" height="48" rx="8" fill="none" stroke="#3b3f48" stroke-width="2"/>
    <text x="290" y="280" font-family="'Inter', sans-serif" font-size="16" fill="#8b92a0" text-anchor="middle" font-weight="500">
      Узнать больше
    </text>
  </g>

  <!-- Bottom gradient fade -->
  <rect x="0" y="620" width="1440" height="100" fill="url(#hero-bg)" opacity="0.8"/>
</svg>
