<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="logo-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Icon: abstract 'A' made of geometric blocks -->
  <g transform="translate(20, 10)">
    <!-- Left pillar -->
    <rect x="0" y="0" width="18" height="100" rx="4" fill="url(#logo-accent)"/>
    <!-- Right pillar -->
    <rect x="52" y="10" width="18" height="90" rx="4" fill="url(#logo-accent)" opacity="0.7"/>
    <!-- Crossbar -->
    <rect x="0" y="36" width="55" height="16" rx="4" fill="#7c3aed"/>
    <!-- Accent dot -->
    <circle cx="85" cy="18" r="8" fill="#a78bfa"/>
    <!-- Accent line -->
    <rect x="80" y="42" width="20" height="4" rx="2" fill="#7c3aed" opacity="0.5"/>
  </g>

  <!-- Text -->
  <g transform="translate(130, 28)">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#D8DEE9" letter-spacing="2">ARCHITECT</text>
    <text x="0" y="28" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#7c3aed" letter-spacing="6" opacity="0.8">DESIGN · BUILD · SCALE</text>
  </g>
</svg>
